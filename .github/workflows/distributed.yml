name: Reusable distributed compute
on:
  workflow_call:
    inputs:
      workers:
        type: number
        default: 4
      processes:
        type: number
        default: 4
      tasks:
        type: number
        default: 128
      cells:
        type: number
        default: 48
      steps:
        type: number
        default: 4000
      baseline:
        type: boolean
        default: true
      name:
        type: string
        default: hex
      framework_ref:
        description: Full framework commit SHA; required when called from another repository.
        type: string
        default: ''
      task_file:
        description: Optional JSON task-list path in the caller checkout.
        type: string
        default: ''
      adapter:
        description: Optional Python adapter path in the caller checkout.
        type: string
        default: ''
      resume_run_id:
        description: Same-repository workflow run containing compatible published checkpoints.
        type: number
        default: 0
      retries:
        type: number
        default: 1
      task_timeout:
        type: number
        default: 300
      timeout_minutes:
        type: number
        default: 30
    outputs:
      report_artifact:
        description: Name of the JSON/Markdown evidence artifact.
        value: ${{ jobs.aggregate.outputs.report_artifact }}
      result_sha256:
        description: Canonical distributed result digest; empty on failure.
        value: ${{ jobs.aggregate.outputs.result_sha256 }}
permissions:
  contents: read
  actions: read
jobs:
  plan:
    name: ${{ inputs.name }} / plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      artifact: ${{ inputs.name }}-plan-a${{ github.run_attempt }}
    steps:
      - name: Validate workflow inputs
        env:
          HEX_NAME: ${{ inputs.name }}
          FRAMEWORK_REF: ${{ inputs.framework_ref }}
          JOB_TIMEOUT: ${{ inputs.timeout_minutes }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[A-Za-z0-9_-]{1,32}', os.environ['HEX_NAME']), 'invalid artifact namespace'
          ref = os.environ['FRAMEWORK_REF']
          assert not ref or re.fullmatch(r'[0-9a-f]{40}', ref), 'framework_ref must be a full commit SHA'
          assert os.environ['GITHUB_REPOSITORY'] == 'techrote/HEXADECARUNNER' or ref, 'external callers must pin framework_ref'
          assert 1 <= int(os.environ['JOB_TIMEOUT']) <= 360, 'timeout_minutes must be 1..360'
          assert int(os.environ['RESUME_RUN_ID']) >= 0, 'resume_run_id must be nonnegative'
          PY
      - name: Checkout framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: techrote/HEXADECARUNNER
          ref: ${{ inputs.framework_ref || github.sha }}
          path: framework
          persist-credentials: false
      - name: Checkout workload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workload
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build deterministic manifest
        id: plan
        env:
          WORKERS: ${{ inputs.workers }}
          PROCESSES: ${{ inputs.processes }}
          TASKS: ${{ inputs.tasks }}
          CELLS: ${{ inputs.cells }}
          STEPS: ${{ inputs.steps }}
          RETRIES: ${{ inputs.retries }}
          TASK_TIMEOUT: ${{ inputs.task_timeout }}
          TASK_FILE: ${{ inputs.task_file }}
          ADAPTER: ${{ inputs.adapter }}
        run: |
          matrix=$(python framework/hexrunner.py plan --workers "$WORKERS" --processes "$PROCESSES" \
            --tasks "$TASKS" --cells "$CELLS" --steps "$STEPS" --retries "$RETRIES" \
            --task-timeout "$TASK_TIMEOUT" --task-file "$TASK_FILE" --adapter "$ADAPTER" \
            --workdir workload --source "$GITHUB_SHA" --framework-source "$(git -C framework rev-parse HEAD)" --output plan)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Upload manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-plan-a${{ github.run_attempt }}
          path: plan/manifest.json
          if-no-files-found: error
          retention-days: 7
  baseline:
    name: ${{ inputs.name }} / baseline
    needs: plan
    if: inputs.baseline
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: techrote/HEXADECARUNNER
          ref: ${{ inputs.framework_ref || github.sha }}
          path: framework
          persist-credentials: false
      - name: Checkout workload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workload
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: plan
      - name: Restore published baseline checkpoints
        if: inputs.resume_run_id != 0 || github.run_attempt > 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.name }}-baseline-a*
          path: resume
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id || github.run_id }}
      - name: Compute
        env:
          RESTORE: ${{ inputs.resume_run_id != 0 || github.run_attempt > 1 }}
          REQUIRE_RESTORE: ${{ inputs.resume_run_id != 0 }}
        run: |
          args=()
          if [[ "$RESTORE" == true ]]; then
            mkdir -p resume
            if [[ -n "$(find resume -type f \( -name worker.json -o -name 'task-*.json' \) -print -quit)" ]]; then
              args+=(--resume resume)
            elif [[ "$REQUIRE_RESTORE" == true ]]; then
              echo "Explicit resume requested but no checkpoints were published" >&2
              exit 1
            else
              echo "No published checkpoints for this rerun; recomputing the shard"
            fi
          fi
          python framework/hexrunner.py worker --manifest plan/manifest.json --baseline --index 0 \
            --workdir workload --output checkpoint "${args[@]}"
      - name: Upload checkpoints
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-baseline-a${{ github.run_attempt }}
          path: checkpoint/
          if-no-files-found: warn
          retention-days: 7
  worker:
    name: ${{ inputs.name }} / worker-${{ matrix.worker }}
    needs: [plan, baseline]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.baseline.result == 'success' || needs.baseline.result == 'skipped') }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.workers }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: techrote/HEXADECARUNNER
          ref: ${{ inputs.framework_ref || github.sha }}
          path: framework
          persist-credentials: false
      - name: Checkout workload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workload
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: plan
      - name: Restore published worker checkpoints
        if: inputs.resume_run_id != 0 || github.run_attempt > 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.name }}-worker-${{ matrix.worker }}-a*
          path: resume
          github-token: ${{ github.token }}
          run-id: ${{ inputs.resume_run_id || github.run_id }}
      - name: Compute
        env:
          INDEX: ${{ matrix.worker }}
          RESTORE: ${{ inputs.resume_run_id != 0 || github.run_attempt > 1 }}
          REQUIRE_RESTORE: ${{ inputs.resume_run_id != 0 }}
        run: |
          args=()
          if [[ "$RESTORE" == true ]]; then
            mkdir -p resume
            if [[ -n "$(find resume -type f \( -name worker.json -o -name 'task-*.json' \) -print -quit)" ]]; then
              args+=(--resume resume)
            elif [[ "$REQUIRE_RESTORE" == true ]]; then
              echo "Explicit resume requested but no checkpoints were published" >&2
              exit 1
            else
              echo "No published checkpoints for this rerun; recomputing the shard"
            fi
          fi
          python framework/hexrunner.py worker --manifest plan/manifest.json --index "$INDEX" \
            --workdir workload --output checkpoint "${args[@]}"
      - name: Upload checkpoints
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-worker-${{ matrix.worker }}-a${{ github.run_attempt }}
          path: checkpoint/
          if-no-files-found: warn
          retention-days: 7
  aggregate:
    name: ${{ inputs.name }} / aggregate
    needs: [plan, baseline, worker]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      report_artifact: ${{ inputs.name }}-report-a${{ github.run_attempt }}
      result_sha256: ${{ steps.reduce.outputs.result_sha256 }}
    steps:
      - name: Checkout framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: techrote/HEXADECARUNNER
          ref: ${{ inputs.framework_ref || github.sha }}
          path: framework
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: plan
      - name: Download result artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.name }}-*
          path: received
      - name: Validate and reduce
        id: reduce
        env:
          BASELINE: ${{ inputs.baseline }}
          WORKER_STATUS: ${{ needs.worker.result }}
          BASELINE_STATUS: ${{ needs.baseline.result }}
        run: |
          args=()
          if [[ "$BASELINE" != true ]]; then args+=(--no-baseline); fi
          python framework/hexrunner.py aggregate --manifest plan/manifest.json --inputs received --output report \
            --upstream-workers "$WORKER_STATUS" --upstream-baseline "$BASELINE_STATUS" "${args[@]}"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print('result_sha256=' + json.load(open('report/report.json'))['result_sha256'])
          PY
      - name: Collect GitHub scheduling and transfer telemetry
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEX_NAMESPACE: ${{ inputs.name }}
        run: python framework/scripts/telemetry.py --output report
      - name: Publish job summary
        if: always()
        run: |
          for file in report/report.md report/telemetry.md; do
            if [[ -f "$file" ]]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.name }}-report-a${{ github.run_attempt }}
          path: |
            report/
            plan/manifest.json
          if-no-files-found: error
          retention-days: 7
