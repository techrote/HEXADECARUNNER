name: Sprocket runner smoke

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/sprocket-runner-smoke
    paths:
      - '.github/workflows/sprocket-smoke.yml'
      - 'experiments/sprocket-runner-smoke/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: sprocket-runner-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Sprocket CPU inference smoke test
        shell: bash
        run: bash experiments/sprocket-runner-smoke/run.sh
