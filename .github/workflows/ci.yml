name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Unit and local topology integration tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Preserve source and test evidence
        if: always()
        run: tar -czf source-test-evidence.tar.gz hexrunner.py tests examples scripts .github docs README.md AGENTS.md unittest.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-a${{ github.run_attempt }}
          path: source-test-evidence.tar.gz
          if-no-files-found: error
          retention-days: 7
  distributed:
    needs: quality
    uses: ./.github/workflows/distributed.yml
    with:
      name: smoke
      workers: 4
      processes: 4
      tasks: 64
      cells: 48
      steps: 1000
      baseline: true
